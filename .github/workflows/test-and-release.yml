name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request: {}

permissions:
  contents: read

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
      # CGO is needed for malgo (audio) and golang.design/x/hotkey (keybindings).
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libX11 dev headers (golang.design/x/hotkey needs Xlib.h + -lX11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install MinGW (C compiler for CGO)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v3

      - run: go vet ./...
      - run: go test ./...

  # Builds one binary per matrix leg natively on its own OS (no CGO cross-compile,
  # that's unreliable across platform boundaries) and attaches it to the GitHub
  # Release for the pushed tag (softprops/action-gh-release creates the release on
  # the first call and just adds more files on the next, so the matrix legs don't
  # need a separate merge job).
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libX11 dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Install MinGW (C compiler for CGO)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v3

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o hannah-satellite-lite-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/satellite

      - uses: softprops/action-gh-release@v3
        with:
          files: hannah-satellite-lite-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
